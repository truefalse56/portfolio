server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    # 1. Защита служебных каталогов (аналог RewriteRule ^(config|includes|...) - [F,L])
    location ~ ^/(config|includes|sql|templates|storage|app|vendor)(/|$) {
        deny all;
        return 403;
    }

    # 2. Защита скрытых файлов (.git, .env и т.д.) — на всякий случай
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 3. Отдаём реальные файлы напрямую (css/js/images/uploads/favicon)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. Обработка PHP (передаём в контейнер app)
    location ~ \.php$ {
        # Если файла нет — 404 (защита от выполнения несуществующих скриптов)
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 5. Заголовки безопасности (аналог mod_headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Отключаем вывод версии Nginx в ошибках
    server_tokens off;
}