services:
  # PHP-FPM (наш код)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slim_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    networks:
      - slim_network
    depends_on:
      - db

  # Nginx (веб-сервер)
  web:
    image: nginx:alpine
    container_name: slim_web
    restart: unless-stopped
    ports:
      - "8080:80"   # Сайт будет доступен на http://localhost:8080
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - slim_network
    depends_on:
      - app

  # MySQL 5.7
  db:
    image: mysql:5.7
    container_name: slim_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
      # Положите *.sql в docker/mysql/init/ — импорт только при первом создании тома
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"  # 3307, чтобы не конфликтовать с возможным MySQL на хосте
    networks:
      - slim_network

networks:
  slim_network:
    driver: bridge

volumes:
  db_data:
